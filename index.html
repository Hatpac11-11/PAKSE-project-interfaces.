<!doctype html>
<html>
    <head>
        <title>Login</title>
        <meta http-equiv="refresh" content="10">
        <meta name="viewport" content="width=device-width, initial-scale=10.0, maximum-scale=10.0, minimum-scale=10.0, user-scalable=no"/>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="wrapper">
            <form action="">
                <h1>Login to PAKSE account</h1>
                <div class="shaun">
                    <img src="logo.png">
                </div>
                <div class="input-box">
                    <label>
                    <input type="text" placeholder="Username" required><s></s>
                    </label>
                </div><div class="input-box">
                    <input type="password" placeholder="Password" required>
                </div>
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox"class="check">I accept the Terms and policies of this PAKSE website
                    </label>
                    <a href="passwords.html">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="register-link">
                    <p>Don't have an account?<a href="#">Sign-up</a></p>
                </div>
            </form>
        </div>
    </body>
</html>
